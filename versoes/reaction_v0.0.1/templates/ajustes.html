<!doctype html>
<html lang="pt-PT" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReAction | Ajustes</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#ff6b35">

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Poppins', 'sans-serif'],
                        body: ['DM Sans', 'sans-serif']
                    },
                    colors: {
                        brand: '#ff6b35',
                        sidebar: '#3a3a3a',
                        bglight: '#f4f4f5'
                    }
                }
            }
        } 
    </script>

    <style>
        /* Reset e Estrutura Base */
        html,
        body {
            height: 100%;
            margin: 0;
            background-color: #f4f4f5;
        }

        .app-shell {
            height: 100%;
            display: flex;
            overflow: hidden;
        }

        .main-scroll {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* Scrollbar minimalista */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d4d4d8;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1aa;
        }

        /* Navegação Lateral */
        .nav-item {
            transition: all 0.2s ease;
        }

        .nav-item:hover:not(.active) {
            background: rgba(255, 107, 53, 0.05);
            color: #d1d5db;
        }

        .nav-item.active {
            border-left: 3px solid #ff6b35;
            color: white;
            background: rgba(255, 107, 53, 0.1);
        }

        /* Notificações (Toasts) */
        .toast-msg {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: #27272a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            animation: slide-up 0.3s ease-out;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translate(-50%, 16px);
            }

            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        /* Área Segura Mobile (Notch iPhones) */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>

<body class="h-full font-body text-gray-800">
    <div class="app-shell" id="app-shell">

        <aside id="sidebar" class="w-64 flex-shrink-0 flex-col transition-all bg-sidebar hidden md:flex z-20 shadow-xl">

            <!-- LOGO DA SIDEBAR PADRONIZADA COM A LANDING PAGE -->
            <div class="p-6 flex items-center gap-3">
                <div
                    class="w-9 h-9 bg-brand rounded-xl flex items-center justify-center shadow-md shadow-brand/20 shrink-0">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <path d="M9 12l2 2 4-4"></path>
                    </svg>
                </div>
                <span class="font-heading font-bold text-xl text-white tracking-tight">Re<span
                        class="text-brand">Action</span></span>
            </div>

            <nav class="flex-1 mt-6 px-4 space-y-1.5" role="navigation">
                <button
                    class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-gray-200 text-sm font-medium"
                    onclick="window.location.href='/app'">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </button>
                <button
                    class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-gray-200 text-sm font-medium"
                    onclick="window.location.href='/reputacao'">
                    <i data-lucide="message-square" class="w-5 h-5"></i> Reputação
                </button>
                <button
                    class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-gray-200 text-sm font-medium"
                    onclick="window.location.href='/minhas_acoes'">
                    <i data-lucide="list-checks" class="w-5 h-5"></i> Minhas Ações
                </button>
                <button
                    class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-gray-200 text-sm font-medium"
                    onclick="window.location.href='/relatorios'">
                    <i data-lucide="pie-chart" class="w-5 h-5"></i> Relatórios
                </button>
                <button
                    class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-gray-200 text-sm font-medium"
                    onclick="window.location.href='/sala_maquinas'">
                    <i data-lucide="settings" class="w-5 h-5"></i> Sala de Máquinas
                </button>
                <button
                    class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-gray-200 text-sm font-medium"
                    onclick="window.location.href='/integracoes'">
                    <i data-lucide="link" class="w-5 h-5"></i> Integrações
                </button>
            </nav>

            <div class="p-5 border-t border-gray-700/50 flex items-center gap-3 bg-black/10 m-3 rounded-2xl">
                <div
                    class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold bg-brand shadow-inner">
                    {{ usuario.iniciais }}
                </div>
                <div class="text-sm text-gray-300 truncate flex-1 font-medium">
                    {{ usuario.nome }}
                </div>
                <a href="/ajustes" class="text-brand transition-colors p-1" title="Ajustes">
                    <i data-lucide="settings" class="w-4 h-4 text-brand"></i>
                </a>
                <a href="/logout" class="text-gray-500 hover:text-red-400 transition-colors p-1" title="Sair">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </a>
            </div>
        </aside>

        <main class="main-scroll relative" id="main-area">

            <!-- LOGO MOBILE PADRONIZADA COM A LANDING PAGE -->
            <div
                class="md:hidden flex items-center justify-between px-6 py-4 bg-white/80 backdrop-blur-md sticky top-0 z-10 border-b border-gray-200/60">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 bg-brand rounded-lg flex items-center justify-center shadow-sm shrink-0">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            <path d="M9 12l2 2 4-4"></path>
                        </svg>
                    </div>
                    <span class="font-heading font-bold text-lg text-gray-900 tracking-tight">Re<span
                            class="text-brand">Action</span></span>
                </div>
                <div
                    class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold bg-brand shadow-sm">
                    {{ usuario.iniciais }}
                </div>
            </div>

            <header class="px-6 md:px-10 py-8">
                <h1 class="font-heading font-bold text-3xl text-gray-900 tracking-tight">Perfil & Ajustes</h1>
                <p class="text-gray-500 text-sm mt-2 font-medium">Gerencie as suas informações de acesso e da conta.</p>
            </header>

            <section class="px-6 md:px-10 pb-28 md:pb-20 max-w-2xl space-y-8">

                <div
                    class="bg-white p-6 md:p-8 rounded-3xl border border-gray-100 shadow-sm transition-all hover:shadow-md">
                    <h2 class="font-heading font-bold text-lg text-gray-900 mb-6 flex items-center gap-2">
                        <i data-lucide="user" class="text-brand w-5 h-5"></i> Informações Pessoais
                    </h2>
                    <form class="space-y-5 settings-form">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Nome Completo</label>
                            <input type="text" value="{{ usuario.nome }}"
                                class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand/40 focus:border-brand transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Endereço de E-mail</label>
                            <input type="email" value="jadson@frameia.com.br"
                                class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand/40 focus:border-brand transition-all">
                        </div>
                        <div class="pt-2">
                            <button type="submit"
                                class="bg-brand text-white px-6 py-3 rounded-xl font-bold text-sm shadow-lg shadow-brand/20 hover:brightness-110 transition-all flex items-center justify-center gap-2 w-full sm:w-auto">
                                Guardar Alterações
                            </button>
                        </div>
                    </form>
                </div>

                <div
                    class="bg-white p-6 md:p-8 rounded-3xl border border-gray-100 shadow-sm transition-all hover:shadow-md">
                    <h2 class="font-heading font-bold text-lg text-gray-900 mb-6 flex items-center gap-2">
                        <i data-lucide="shield-check" class="text-brand w-5 h-5"></i> Segurança
                    </h2>
                    <form class="space-y-5 settings-form">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Palavra-passe Atual</label>
                            <input type="password" placeholder="••••••••"
                                class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-gray-400 transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Nova Palavra-passe</label>
                            <input type="password" placeholder="Escreva a nova palavra-passe"
                                class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-gray-400 transition-all">
                        </div>
                        <div class="pt-2">
                            <button type="submit"
                                class="bg-gray-800 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-md hover:bg-gray-900 transition-all flex items-center justify-center gap-2 w-full sm:w-auto">
                                Atualizar Palavra-passe
                            </button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <div
        class="fixed bottom-0 left-0 right-0 z-50 md:hidden pb-safe bg-white/90 backdrop-blur-md border-t border-gray-200 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
        <nav class="flex items-center justify-around h-[68px] px-2">
            <a href="/app"
                class="flex flex-col items-center justify-center w-full h-full gap-1 group text-gray-400 hover:text-brand transition-colors">
                <i data-lucide="layout-dashboard" class="w-6 h-6 transition-transform group-hover:scale-110"></i>
                <span class="text-[10px] font-semibold">Cockpit</span>
            </a>
            <a href="/reputacao"
                class="flex flex-col items-center justify-center w-full h-full gap-1 group text-gray-400 hover:text-brand transition-colors">
                <i data-lucide="message-square" class="w-6 h-6 transition-transform group-hover:scale-110"></i>
                <span class="text-[10px] font-semibold">Reputação</span>
            </a>
            <a href="/ajustes" class="flex flex-col items-center justify-center w-full h-full gap-1 active group">
                <div class="px-5 py-1 rounded-full bg-brand/10 transition-colors">
                    <i data-lucide="user" class="w-6 h-6 text-brand"></i>
                </div>
                <span class="text-[10px] font-bold text-brand">Perfil</span>
            </a>
            <a href="/integracoes"
                class="flex flex-col items-center justify-center w-full h-full gap-1 group text-gray-400 hover:text-brand transition-colors">
                <i data-lucide="menu" class="w-6 h-6 transition-transform group-hover:scale-110"></i>
                <span class="text-[10px] font-semibold">Menu</span>
            </a>
        </nav>
    </div>

    <div id="toast-container"></div>

    <script>
        // Inicializa os ícones do Lucide
        lucide.createIcons();

        // Sistema de Toasts (Notificações)
        function toast(msg) {
            const el = document.createElement('div');
            el.className = 'toast-msg font-medium';
            el.textContent = msg;
            document.getElementById('toast-container').appendChild(el);

            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.3s ease-out';
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        // Simulação visual de salvamento nos formulários
        document.querySelectorAll('.settings-form').forEach(form => {
            form.addEventListener('submit', (e) => {
                e.preventDefault(); // Evita recarregar a página

                const btn = form.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;

                // Estado de "A Carregar"
                btn.disabled = true;
                btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Guardando...';
                lucide.createIcons({ root: btn });

                // Simula tempo de requisição à API
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    lucide.createIcons({ root: btn });
                    toast('✅ Alterações guardadas com sucesso!');

                    // Se for o formulário de senha, limpa os campos
                    if (form.querySelector('input[type="password"]')) {
                        form.reset();
                    }
                }, 800);
            });
        });
    </script>
</body>

</html>
