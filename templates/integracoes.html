<!doctype html>
<html lang="pt-BR" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReAção - Integrações</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { heading: ['Poppins', 'sans-serif'], body: ['DM Sans', 'sans-serif'] }, colors: { brand: '#ff6b35', sidebar: '#3a3a3a', bglight: '#e5e5e7' } } } } 
    </script>
    <style>
        html,
        body {
            height: 100%;
            background-color: #e5e5e7;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(255, 107, 53, 0.12);
        }

        .nav-item.active {
            border-left: 3px solid #ff6b35;
            color: white;
        }

        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 999;
            animation: slide-up 0.3s ease-out;
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="h-full font-body text-gray-800 flex overflow-hidden">

    <aside id="sidebar" class="w-60 flex-shrink-0 flex flex-col bg-sidebar">
        <div class="p-5 flex items-center gap-2">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="12" stroke="#ff6b35" stroke-width="2.5" />
                <path d="M10 14l3 3 5-6" stroke="#ff6b35" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            <span class="font-heading font-bold text-lg text-white tracking-tight">Re<span
                    class="text-brand">Ação</span></span>
        </div>
        <nav class="flex-1 mt-4 px-3 space-y-1">
            <button
                class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 text-sm font-medium"
                onclick="window.location.href='/app'"><i data-lucide="layout-dashboard" class="w-[18px] h-[18px]"></i>
                Dashboard</button>
            <button
                class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 text-sm font-medium"
                onclick="window.location.href='/reputacao'"><i data-lucide="message-square"
                    class="w-[18px] h-[18px]"></i> Reputação</button>
            <button
                class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 text-sm font-medium"
                onclick="window.location.href='/sala_maquinas'"><i data-lucide="settings" class="w-[18px] h-[18px]"></i>
                Sala de Máquinas</button>
            <button
                class="nav-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-white text-sm font-medium"><i
                    data-lucide="link" class="w-[18px] h-[18px]"></i> Integrações</button>
        </nav>
    </aside>

    <div class="flex-1 overflow-y-auto">
        <header class="px-8 py-5 bg-white border-b border-gray-200">
            <h1 class="font-heading font-semibold text-xl text-gray-800">Conectar Canais</h1>
            <p class="text-sm text-gray-400 mt-0.5">Ligue as suas contas para que o ReAção possa atuar de forma
                automática.</p>
        </header>

        <main class="p-8 max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <div
                class="bg-white rounded-2xl border border-gray-200 p-6 flex flex-col items-center text-center shadow-sm">
                <div class="w-14 h-14 bg-blue-50 rounded-xl flex items-center justify-center mb-4 text-blue-600">
                    <i data-lucide="map-pin" class="w-7 h-7"></i>
                </div>
                <h3 class="font-heading font-semibold text-lg text-gray-800">Google Business</h3>
                <p class="text-xs text-gray-500 mt-2 mb-6">Sincronize as avaliações do Google Meu Negócio e responda via
                    IA.</p>
                <div id="status-google" class="mt-auto w-full">
                    <button onclick="window.location.href='/api/auth/google/login'"
                        class="w-full py-2.5 rounded-lg border border-gray-200 text-gray-700 text-sm font-semibold hover:bg-gray-50 transition">Conectar
                        Conta</button>
                </div>
            </div>

            <div
                class="bg-white rounded-2xl border border-gray-200 p-6 flex flex-col items-center text-center shadow-sm">
                <div class="w-14 h-14 bg-pink-50 rounded-xl flex items-center justify-center mb-4 text-pink-600">
                    <i data-lucide="instagram" class="w-7 h-7"></i>
                </div>
                <h3 class="font-heading font-semibold text-lg text-gray-800">Instagram</h3>
                <p class="text-xs text-gray-500 mt-2 mb-6">Proteja a caixa de comentários e os Directs do seu Instagram.
                </p>
                <div id="status-instagram" class="mt-auto w-full">
                    <button onclick="window.location.href='/api/auth/instagram/login'"
                        class="w-full py-2.5 rounded-lg border border-gray-200 text-gray-700 text-sm font-semibold hover:bg-gray-50 transition">Conectar
                        Conta</button>
                </div>
            </div>

        </main>
    </div>

    <div id="toast-container"></div>

    <script>
        lucide.createIcons();

        function toast(msg) {
            const el = document.createElement('div'); el.className = 'toast-msg'; el.textContent = msg;
            document.getElementById('toast-container').appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        // Verifica se voltou de um redirecionamento com sucesso
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('sucesso') === 'true') {
            toast(`✅ Conta do ${urlParams.get('plat')} conectada com sucesso!`);
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // Carrega o status do banco para pintar de verde o que já está ligado
        async function carregarStatus() {
            try {
                const res = await fetch('/api/integracoes/status');
                if (res.ok) {
                    const integracoes = await res.json();
                    integracoes.forEach(intg => {
                        if (intg.status === 'ativo') {
                            const container = document.getElementById(`status-${intg.plataforma}`);
                            if (container) {
                                container.innerHTML = `
                                <div class="w-full py-2.5 rounded-lg bg-emerald-50 text-emerald-700 text-sm font-semibold flex items-center justify-center gap-2 border border-emerald-200">
                                    <i data-lucide="check-circle" class="w-4 h-4"></i> Conta Conectada
                                </div>
                            `;
                            }
                        }
                    });
                    lucide.createIcons();
                }
            } catch (e) { console.error("Erro ao ler integrações", e); }
        }

        carregarStatus();
    </script>
</body>

</html>
