<!doctype html>
<html lang="pt-PT" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReAção - Gestor de Reputação</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { heading: ['Poppins', 'sans-serif'], body: ['DM Sans', 'sans-serif'] }, colors: { brand: '#ff6b35', dark: '#3a3a3a', bglight: '#e5e5e7' } } } }
    </script>
    <style>
        body {
            background-color: #e5e5e7;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="h-full font-body flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden fade-in border border-gray-100">

        <div class="bg-dark p-8 text-center flex flex-col items-center">
            <svg width="40" height="40" viewBox="0 0 28 28" fill="none" class="mb-3">
                <circle cx="14" cy="14" r="12" stroke="#ff6b35" stroke-width="2.5" />
                <path d="M10 14l3 3 5-6" stroke="#ff6b35" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            <h1 class="font-heading font-bold text-3xl text-white tracking-tight">Re<span class="text-brand">Ação</span>
            </h1>
            <p class="text-gray-400 text-sm mt-1">O seu gestor de reputação inteligente</p>
        </div>

        <div class="p-8">

            {% if erro %}
            <div
                class="mb-4 p-3 bg-red-50 border border-red-100 text-red-600 text-sm rounded-lg flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4"></i> {{ erro }}
            </div>
            {% endif %}

            {% if erro_registo %}
            <div
                class="mb-4 p-3 bg-red-50 border border-red-100 text-red-600 text-sm rounded-lg flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4"></i> {{ erro_registo }}
            </div>
            {% endif %}

            {% if sucesso %}
            <div
                class="mb-4 p-3 bg-emerald-50 border border-emerald-100 text-emerald-600 text-sm rounded-lg flex items-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4"></i> {{ sucesso }}
            </div>
            {% endif %}

            <form id="form-login" action="/login" method="POST"
                class="space-y-4 {% if mostrar_registo %}hidden{% endif %}">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" name="email" required
                        class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand transition"
                        placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Palavra-passe</label>
                    <input type="password" name="senha" required
                        class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand transition"
                        placeholder="••••••••">
                </div>
                <button type="submit"
                    class="w-full py-3 mt-2 rounded-lg text-white font-semibold flex items-center justify-center gap-2 bg-brand hover:brightness-110 transition shadow-lg shadow-orange-500/30">
                    Entrar na Plataforma <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
                <p class="text-center text-sm text-gray-500 mt-6">
                    Não tem uma conta? <a href="#" onclick="toggleForms(event)"
                        class="text-brand font-semibold hover:underline">Criar conta</a>
                </p>
            </form>

            <form id="form-registo" action="/registo" method="POST"
                class="space-y-4 {% if not mostrar_registo %}hidden{% endif %}">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome da Empresa</label>
                    <input type="text" name="nome_empresa" required
                        class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand transition"
                        placeholder="A sua empresa">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">O seu Nome</label>
                    <input type="text" name="nome_usuario" required
                        class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand transition"
                        placeholder="Como gosta de ser chamado">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail de Acesso</label>
                    <input type="email" name="email" required
                        class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand transition"
                        placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Criar Palavra-passe</label>
                    <input type="password" name="senha" required
                        class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand transition"
                        placeholder="No mínimo 6 caracteres">
                </div>
                <button type="submit"
                    class="w-full py-3 mt-2 rounded-lg text-white font-semibold flex items-center justify-center gap-2 bg-dark hover:bg-black transition shadow-lg">
                    Criar Nova Conta <i data-lucide="user-plus" class="w-4 h-4"></i>
                </button>
                <p class="text-center text-sm text-gray-500 mt-6">
                    Já é cliente? <a href="#" onclick="toggleForms(event)"
                        class="text-brand font-semibold hover:underline">Iniciar sessão</a>
                </p>
            </form>

        </div>
    </div>

    <script>
        lucide.createIcons();

        // Função simples para alternar entre Login e Registo visualmente
        function toggleForms(e) {
            e.preventDefault();
            document.getElementById('form-login').classList.toggle('hidden');
            document.getElementById('form-registo').classList.toggle('hidden');
        }
    </script>
</body>

</html>
