<!doctype html>
<html lang="pt-BR" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReAção - Sala de Máquinas</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { heading: ['Poppins', 'sans-serif'], body: ['DM Sans', 'sans-serif'] }, colors: { brand: '#ff6b35', sidebar: '#3a3a3a', bglight: '#e5e5e7' } } } } 
    </script>
    <style>
        html,
        body {
            height: 100%;
            background-color: #e5e5e7;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(255, 107, 53, 0.12);
        }

        .nav-item.active {
            border-left: 3px solid #ff6b35;
            color: white;
        }

        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 999;
            animation: slide-up 0.3s ease-out;
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="h-full font-body text-gray-800 flex overflow-hidden">

    <aside id="sidebar" class="w-60 flex-shrink-0 flex flex-col bg-sidebar">
        <div class="p-5 flex items-center gap-2">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="12" stroke="#ff6b35" stroke-width="2.5" />
                <path d="M10 14l3 3 5-6" stroke="#ff6b35" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            <span class="font-heading font-bold text-lg text-white tracking-tight">Re<span
                    class="text-brand">Ação</span></span>
        </div>
        <nav class="flex-1 mt-4 px-3 space-y-1">
            <button
                class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 text-sm font-medium"
                onclick="window.location.href='/app'"><i data-lucide="layout-dashboard" class="w-[18px] h-[18px]"></i>
                Dashboard</button>
            <button
                class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 text-sm font-medium"
                onclick="window.location.href='/reputacao'"><i data-lucide="message-square"
                    class="w-[18px] h-[18px]"></i> Reputação</button>
            <button
                class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 text-sm font-medium"><i
                    data-lucide="list-checks" class="w-[18px] h-[18px]"></i> Minhas Ações</button>
            <button
                class="nav-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-white text-sm font-medium"><i
                    data-lucide="settings" class="w-[18px] h-[18px]"></i> Sala de Máquinas</button>
            <button
                class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 text-sm font-medium"
                onclick="window.location.href='/integracoes'">
                <i data-lucide="link" class="w-[18px] h-[18px]"></i> Integrações
            </button>
        </nav>
    </aside>

    <div class="flex-1 overflow-y-auto">
        <header class="px-8 py-5 bg-white border-b border-gray-200">
            <h1 class="font-heading font-semibold text-xl text-gray-800">Calibragem da IA</h1>
            <p class="text-sm text-gray-400 mt-0.5">Defina as regras de ouro e o tom de voz para o agente de reputação
                atuar.</p>
        </header>

        <main class="p-8 max-w-4xl mx-auto">
            <div class="bg-white rounded-2xl border border-gray-200 p-8 shadow-sm">

                <form id="form-ia" class="space-y-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">WhatsApp para Contenção de Crises
                            <span class="text-red-500">*</span></label>
                        <p class="text-xs text-gray-400 mb-2">Para onde a IA deve enviar os clientes insatisfeitos?</p>
                        <div class="flex items-center">
                            <span
                                class="bg-gray-100 border border-gray-200 border-r-0 px-4 py-2.5 rounded-l-lg text-gray-500 text-sm">wa.me/</span>
                            <input type="text" id="inp-whatsapp" placeholder="5585999999999"
                                class="flex-1 border border-gray-200 rounded-r-lg px-3 py-2.5 text-sm focus:outline-none focus:border-brand transition"
                                required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Tom de Voz da Marca</label>
                        <p class="text-xs text-gray-400 mb-2">Como a IA deve soar nas respostas?</p>
                        <select id="inp-tom"
                            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-brand transition bg-white">
                            <option value="Profissional e empático">Profissional e Empático</option>
                            <option value="Descontraído, jovem e amigável">Descontraído e Jovem</option>
                            <option value="Formal, técnico e direto">Formal e Direto</option>
                            <option value="Divertido e cheio de emojis">Divertido (com emojis)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Regras de Ouro (Instruções do
                            Sistema)</label>
                        <p class="text-xs text-gray-400 mb-2">Quais são as regras que a IA nunca pode quebrar? O que ela
                            deve saber sobre o seu negócio?</p>
                        <textarea id="inp-regras" rows="5"
                            placeholder="Ex: Nunca prometa reembolsos automáticos. Se perguntarem o horário, diga que é das 8h às 18h. Chame os clientes de 'Tripulação'."
                            class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand transition resize-none"></textarea>
                    </div>

                    <hr class="border-gray-100">

                    <div class="flex justify-end">
                        <button type="submit" id="btn-salvar"
                            class="px-6 py-2.5 rounded-lg text-white text-sm font-semibold flex items-center gap-2 bg-brand hover:brightness-110 transition shadow-lg shadow-orange-500/30">
                            <i data-lucide="save" class="w-4 h-4"></i> Guardar Calibragem
                        </button>
                    </div>
                </form>

            </div>
        </main>
    </div>

    <div id="toast-container"></div>

    <script>
        lucide.createIcons();

        function toast(msg) {
            const el = document.createElement('div'); el.className = 'toast-msg'; el.textContent = msg;
            document.getElementById('toast-container').appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        // Carrega os dados existentes
        async function carregarConfiguracoes() {
            try {
                const res = await fetch('/api/configuracoes');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('inp-tom').value = data.tom_voz || 'Profissional e empático';
                    document.getElementById('inp-regras').value = data.regras_ouro || '';
                    document.getElementById('inp-whatsapp').value = data.telefone_whatsapp || '';
                }
            } catch (err) {
                console.error("Erro ao carregar:", err);
            }
        }

        // Salva os novos dados
        document.getElementById('form-ia').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar');
            btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Guardando...';
            btn.disabled = true;

            const payload = {
                tom_voz: document.getElementById('inp-tom').value,
                regras_ouro: document.getElementById('inp-regras').value,
                telefone_whatsapp: document.getElementById('inp-whatsapp').value
            };

            try {
                const res = await fetch('/api/configuracoes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    toast("✅ Regras da IA calibradas com sucesso!");
                } else {
                    toast("❌ Erro ao guardar.");
                }
            } catch (err) {
                toast("❌ Falha de comunicação.");
            } finally {
                btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Guardar Calibragem';
                btn.disabled = false;
                lucide.createIcons();
            }
        };

        carregarConfiguracoes();
    </script>
</body>

</html>
